name: CI

# Los jobs corren en los runners de GitHub (ubuntu-latest): el repo es público
# y esos runners no consumen minutos. Los PRs de fork necesitan aprobación del
# owner antes de correr (ajuste de Actions del repo).
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Un push nuevo a un PR cancela su corrida anterior; los push a develop y
  # master siempre terminan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const code = files.some(
              (file) =>
                !file.filename.endsWith('.md') &&
                !file.filename.startsWith('docs/'),
            );
            core.setOutput('code', String(code));

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests with coverage
        run: pnpm run --if-present test:coverage

  # El contrato del cliente es una copia de swagger-spec.json del back. Este job
  # compara las dos versiones en cada PR: si el back cambia una ruta, un
  # parámetro o un esquema y la copia no se regenera, el cliente sigue enviando
  # el nombre viejo y el API responde 400 (pasó con personal-os-back#436).
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Traer el contrato vigente del back
        uses: actions/checkout@v4
        with:
          repository: jarvinc3/personal-os-back
          ref: develop
          # personal-os-back es público: el checkout no necesita token propio.
          path: .back-contract
          sparse-checkout: swagger-spec.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Comparar el contrato versionado con el del back
        env:
          OPENAPI_SPEC_PATH: ${{ github.workspace }}/.back-contract/swagger-spec.json
        run: pnpm api:contract:check

  build:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          NEXT_PUBLIC_API_URL: http://localhost:3100
          NEXT_PUBLIC_API_PREFIX: api
          NEXT_PUBLIC_APP_NAME: Personal OS
          NEXT_PUBLIC_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    needs: [checks, build]
    if: always() && needs.checks.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar checks y build
        run: echo "Checks y build completados"
