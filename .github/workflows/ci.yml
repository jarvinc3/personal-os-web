name: CI

# Los jobs corren en la PC de casa (runner self-hosted de Windows) mientras
# GitHub Actions está bloqueado por facturación. El runner es dedicado:
# conserva node_modules entre corridas y usa el store de pnpm de la máquina.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Evita CRLF en el checkout de Windows sin tocar la config global de git
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.longpaths
  GIT_CONFIG_VALUE_1: "true"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, personal-os]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const code = files.some(
              (file) =>
                !file.filename.endsWith('.md') &&
                !file.filename.startsWith('docs/'),
            );
            core.setOutput('code', String(code));

  checks:
    runs-on: [self-hosted, personal-os]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # Conserva node_modules entre corridas para evitar los hardlinks lentos de
      # Windows; el resto del workspace se limpia.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Limpiar el workspace salvo node_modules
        run: git clean -fdx -e node_modules

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$env:LOCALAPPDATA\pnpm\store"

      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests with coverage
        run: pnpm run --if-present test:coverage

  # El contrato del cliente es una copia de swagger-spec.json del back. Este job
  # compara las dos versiones en cada PR: si el back cambia una ruta, un
  # parámetro o un esquema y la copia no se regenera, el cliente sigue enviando
  # el nombre viejo y el API responde 400 (pasó con personal-os-back#436).
  contract:
    runs-on: [self-hosted, personal-os]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Limpiar el workspace salvo node_modules
        run: git clean -fdx -e node_modules

      - name: Comprobar el secreto BACK_REPO_TOKEN
        env:
          BACK_REPO_TOKEN: ${{ secrets.BACK_REPO_TOKEN }}
        run: |
          if (-not $env:BACK_REPO_TOKEN) {
            throw 'Falta el secreto BACK_REPO_TOKEN en este repo. El gate del contrato OpenAPI necesita un token de solo lectura de personal-os-back para leer su swagger-spec.json. Créalo en Settings > Secrets and variables > Actions y vuelve a correr el job.'
          }

      - name: Traer el contrato vigente del back
        uses: actions/checkout@v4
        with:
          repository: jarvinc3/personal-os-back
          ref: develop
          token: ${{ secrets.BACK_REPO_TOKEN }}
          path: .back-contract
          sparse-checkout: swagger-spec.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Comparar el contrato versionado con el del back
        env:
          OPENAPI_SPEC_PATH: ${{ github.workspace }}/.back-contract/swagger-spec.json
        run: pnpm api:contract:check

  build:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: [self-hosted, personal-os]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Limpiar el workspace salvo node_modules
        run: git clean -fdx -e node_modules

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$env:LOCALAPPDATA\pnpm\store"

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          NEXT_PUBLIC_API_URL: http://localhost:3100
          NEXT_PUBLIC_API_PREFIX: api
          NEXT_PUBLIC_APP_NAME: Personal OS
          NEXT_PUBLIC_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    needs: [checks, build]
    if: always() && needs.checks.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, personal-os]
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Confirmar checks y build
        run: echo "Checks y build completados"
